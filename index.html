<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>Character Counter</title>
</head>
<body>
    <main>
        <header>
            <div>
                <img src="/assets/images/logo.png" alt="">
                <h2>Character Counter</h2>
            </div>
            <div>
                <button class="sun-button">
                    <img src="/assets/images/sun.png" alt="">
                </button>
            </div>
        </header>
        <section class="first-sect">  
            <h1>Analyze your text in real-time.</h1>
            <textarea name="" id="" placeholder="Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solution, making them easy to undestand. It blends aesthetics and functionality seamlessly."></textarea> 
                <div class="controles-texto">
                    <div>
                        <input type="checkbox">
                        <label for="">Exclude Spaces</label>
                      
                        <input type="checkbox">
                        <label for="">Set Character Limit</label>
                    </div> 
                    <div>
                        <p>Approx. reading time:<1 minute </p>
                    </div>
                </div>
        </section>
        <section class="second-sect">
            <div class="card">
                <h3>278</h3>
                <h5>Total Characters</h5>
            </div>
            <div class="card2">
                <h3>39</h3>
                <h5>Word Count</h5>
            </div>
            <div class="card3">
                <h3>04</h3>
                <h5>Sentence Count</h5>
            </div>
        </section>
        <section>
            <h4>Letter Density</h4>
            <div class="grupo-progress">
                <div>
                    <p>E</p>
                    <progress value="40" max="100"></progress>
                    <p>40 (16.06%)</p>
                </div>
                <div>
                    <p>I</p>
                    <progress value="29" max="100"></progress>
                    <p>29 (11.65%)</p>
                </div>
                <div>
                    <p>T</p>
                    <progress value="28" max="100"></progress>
                    <p>28 (11.24%)</p>
                </div>
                <div>
                    <p>O</p>
                    <progress value="22" max="100"></progress>
                    <p>22 (8.84%)</p>
                </div>
                <div>
                    <p>N</p>
                    <progress value="21" max="100"></progress>
                    <p>21 (8.43%)</p>
                </div>
            </div>
            <button class="see-more" type="button"><p>See more <span class="flecha">˅</span></p></button>
        </section>
    </main>
</body>
</html>
